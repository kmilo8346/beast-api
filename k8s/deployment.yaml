apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: beast
  name: beast-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beast-api
  template:
    metadata:
      labels:
        app: beast-api
    spec:
      containers:
        - name: beast-api
          image: kmilo8346/beast-api:staging-2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
