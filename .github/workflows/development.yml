# This is a basic workflow to help you get started with Actions

name: BEAST-API-DEVELOPMENT-CI

# events but only for the master branch
on:
  push:
    branches: [master]

jobs:
  setup-build-publish-deply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set env
        env:
          NODE_ENV: development
          BEAST_PORT: ${{secrets.BEAST_PORT_DEV}}
          ELASTIC_NODE: ${{secrets.ELASTIC_NODE_DEV}}
          ELASTIC_USERNAME: ${{secrets.DEV_ELASTIC_USERNAME}}
          ELASTIC_PASSWORD: ${{secrets.DEV_ELASTIC_PASSWORD}}
          GOOGLE_PLACES_URL: ${{secrets.GOOGLE_PLACES_URL}}
          GOOGLE_PLACES_REQUEST_TIMEOUT: ${{secrets.GOOGLE_PLACES_REQUEST_TIMEOUT}}
          GOOGLE_PLACES_API_KEY: ${{secrets.GOOGLE_PLACES_API_KEY}}
          MERCADO_PAGO_URL: ${{secrets.DEV_MERCADO_PAGO_URL}}
          MERCADO_PAGO_REQUEST_TIMEOUT: ${{secrets.MERCADO_PAGO_REQUEST_TIMEOUT}}
          MERCADO_PAGO_ACCESS_TOKEN: ${{secrets.DEV_MERCADO_PAGO_ACCESS_TOKEN}}
        run: |
          echo Setted DEVELOPMENT env variables

      - name: Docker Login
        env:
          DOCKER_HUB_USER: ${{secrets.DOCKER_HUB_USER}}
          DOCKER_HUB_PASSWORD: ${{secrets.DOCKER_HUB_PASSWORD}}
        run: |
          docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD

      - name: Build
        run: |
          docker build ./ -t firedevs/beast-api:1.0.0

      - name: Publish
        run: |
          docker push firedevs/beast-api:1.0.0
          echo build and published done!!
      - name: Deploy to GKE

      # Setup gcloud CLI
      - uses: GoogleCloudPlatform/github-actions/setup-gcloud@master
        with:
          version: '270.0.0'
          service_account_email: ${{ secrets.GKE_EMAIL }}
          service_account_key: ${{ secrets.GKE_KEY }}

      # Configure docker to use the gcloud command-line tool as a credential helper
      - run: |
          # Set up docker to authenticate
          # via gcloud command-line tool.
          gcloud auth configure-docker

      # Set up kustomize
      - name: Set up Kustomize
        run: |
          curl -o kustomize --location https://github.com/kubernetes-sigs/kustomize/releases/download/v3.1.0/kustomize_3.1.0_linux_amd64
          chmod u+x ./kustomize

      # Deploy the Docker image to the GKE cluster
      - name: Deploy
        env:
          GKE_CLUSTER: ${{secrets.GKE_CLUSTER}}
          GKE_ZONE: ${{secrets.GKE_ZONE}}
          GKE_PROJECT: ${{secrets.GKE_PROJECT}}
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $GKE_PROJECT
          ./kustomize edit set image firedevs/beast-api:1.0.0
          ./kustomize build . | kubectl apply -f ./deployment.yml
