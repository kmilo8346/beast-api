# This is a basic workflow to help you get started with Actions

name: BEAST-API-DEVELOPMENT-CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [master]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains the development enviroment
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs a set of commands using the runners shell
      - name: Build and Push Docker Image with DEV ENV
  run: |
    echo running the DEVELOPMENT configuration to publish and deploy
on:
  push:
    tags:
      -v1.*
jobs:
  # This workflow contains develpment enviroment
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs a set of commands using the runners shell
      - name: Build and Push Docker Image with PROD ENV
  run: |
  echo running the PRODUCTION configuration to publish and deploy