apiVersion: beast/v1
kind: Deployment
metadata:
  name: Beast Api Deployment
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: beast-api
    spec:
      containers:
        - name: beast-api
          image: REGISTRY_HOSTNAME/GKE_PROJECT/IMAGE:GITHUB_SHA
          ports:
            - containerPort: DEV_BEAST_PORT
